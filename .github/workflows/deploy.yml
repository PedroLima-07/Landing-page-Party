name: Publicar landing page

on:
  push:
    branches: [main, feat/landing-angular]
    paths: ['party-landing/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: party-landing/package-lock.json

      - name: Instalar dependencias
        working-directory: party-landing
        run: npm ci

      - name: Build de producao
        working-directory: party-landing
        run: npm run build

      # Sem os segredos o passo seguinte falha com um erro dificil de ler,
      # entao a checagem acontece antes, com o recado do que esta faltando.
      - name: Conferir credenciais do Cloudflare
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CONTA" ]; then
            echo "::error::Faltam os segredos CLOUDFLARE_API_TOKEN e/ou CLOUDFLARE_ACCOUNT_ID. Cadastre os dois em Settings > Secrets and variables > Actions (requer permissao de admin no repositorio)."
            exit 1
          fi

      - name: Publicar no Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: party-landing
          command: deploy
